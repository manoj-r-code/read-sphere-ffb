<div class="container1">
    <div *ngIf="book">
        <div class="card">
            <div class="card-header">
                <h3>{{ book.name }}</h3>
            </div>
            <div class="card-body">
                <p>
                    <strong>Genre:</strong>
                    {{ book.genre }}
                </p>
                <p>
                    <strong>Status:</strong>
                    {{ book.status }}
                </p>
                <p>
                    <strong>Notes:</strong>
                    {{ book.notes }}
                </p>
            </div>
        </div>
        <div class="container">
            <h2>Delete Book</h2>
            <p>Are you sure you want to delete this book?</p>

            <div class="buttons-container">
                <button (click)="deleteBook()">Confirm Delete</button>
                <button routerLink="/view-books">Cancel</button>
            </div>
        </div>
    </div>
</div>
